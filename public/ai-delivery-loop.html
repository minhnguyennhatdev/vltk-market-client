<!doctype html>
<html>
    <head>
        <meta charset="utf8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <style>
            :root {
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            body {
                margin: 0;
                padding: 0;
                font:
                    14px -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: #fff;
                color: #000;
            }
            img {
                max-width: 100%;
            }
            [hidden]:not([hidden="until-found" i]) {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <title>Claims Delivery Loop</title>
        <meta name="claude:viewport-fit-sides" content="cover" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        />
        <style>
            /* Layout: four stacked figures, each in its own scroll box so the drawings stay legible on phones. */
            :root {
                --bg: #f2f5f6;
                --surface: #ffffff;
                --ink: #14222a;
                --muted: #5a6a72;
                --line: #d4dde1;
                --dev: #9c5a0c;
                --dev-bg: #fbefdf;
                --claude: #146b75;
                --claude-bg: #e1f0f1;
                --claude-wash: #f0f7f8;
                --bot: #62509f;
                --bot-bg: #eeeaf7;
                --team: #2a7547;
                --team-bg: #e3f1e8;
                --sys: #55646b;
                --sys-bg: #e9eef0;
                --pend: #8a5e00;
                --pend-bg: #fff3d1;
                --pend-line: #d9a62e;
                --f-display:
                    "IBM Plex Sans Condensed", "Arial Narrow", system-ui,
                    sans-serif;
                --f-body:
                    "IBM Plex Sans", system-ui, -apple-system, "Segoe UI",
                    sans-serif;
                --f-mono:
                    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #0d1518;
                    --surface: #142026;
                    --ink: #e1e9ec;
                    --muted: #93a3aa;
                    --line: #2a3a41;
                    --dev: #efa650;
                    --dev-bg: #2e2012;
                    --claude: #5ec4cd;
                    --claude-bg: #0f2c30;
                    --claude-wash: #112429;
                    --bot: #b2a4ea;
                    --bot-bg: #221d37;
                    --team: #74c996;
                    --team-bg: #12281b;
                    --sys: #a6b4ba;
                    --sys-bg: #1b272c;
                    --pend: #f3c452;
                    --pend-bg: #2d240f;
                    --pend-line: #8c6b1e;
                    color-scheme: dark;
                }
            }
            :root[data-theme="dark"] {
                --bg: #0d1518;
                --surface: #142026;
                --ink: #e1e9ec;
                --muted: #93a3aa;
                --line: #2a3a41;
                --dev: #efa650;
                --dev-bg: #2e2012;
                --claude: #5ec4cd;
                --claude-bg: #0f2c30;
                --claude-wash: #112429;
                --bot: #b2a4ea;
                --bot-bg: #221d37;
                --team: #74c996;
                --team-bg: #12281b;
                --sys: #a6b4ba;
                --sys-bg: #1b272c;
                --pend: #f3c452;
                --pend-bg: #2d240f;
                --pend-line: #8c6b1e;
                color-scheme: dark;
            }

            * {
                box-sizing: border-box;
            }
            body {
                background: var(--bg);
                color: var(--ink);
                font-family: var(--f-body);
                font-size: 15px;
                line-height: 1.5;
            }
            .wrap {
                max-width: 1240px;
                margin: 0 auto;
                padding-block: 36px 56px;
                padding-left: max(16px, env(safe-area-inset-left, 0px));
                padding-right: max(16px, env(safe-area-inset-right, 0px));
                display: grid;
                gap: 44px;
            }
            h1,
            h2 {
                font-family: var(--f-display);
                margin: 0;
                text-wrap: balance;
                letter-spacing: -0.01em;
            }
            h1 {
                font-size: clamp(28px, 4vw, 40px);
                font-weight: 700;
                line-height: 1.1;
            }
            h2 {
                font-size: 21px;
                font-weight: 600;
            }
            figure {
                margin: 0;
                display: grid;
                gap: 12px;
            }
            .fig {
                overflow-x: auto;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--surface);
            }
            .fig svg {
                display: block;
                width: 100%;
                height: auto;
            }
            .fig-wide svg {
                min-width: 940px;
            }
            .fig-mid svg {
                min-width: 780px;
            }
            figcaption {
                font-size: 13.5px;
                color: var(--muted);
                max-width: 70ch;
            }
            .legend {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 20px;
                font-size: 13px;
                color: var(--muted);
                align-items: center;
            }
            .legend span {
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }
            .pend {
                font: 600 10px/1 var(--f-mono);
                letter-spacing: 0.08em;
                color: var(--pend);
                background: var(--pend-bg);
                border: 1px solid var(--pend);
                border-radius: 2px;
                padding: 3px 5px 2px;
                transform: rotate(-4deg);
                display: inline-block;
            }
            .sw-go {
                width: 30px;
                height: 0;
                border-top: 1.6px dashed var(--pend);
            }
            .sw-c {
                width: 30px;
                height: 0;
                border-top: 1.6px solid var(--claude);
            }
            .sw-m {
                width: 30px;
                height: 0;
                border-top: 1.6px solid var(--muted);
            }

            /* SVG */
            svg text {
                font-family: var(--f-body);
            }
            .sep {
                stroke: var(--line);
                stroke-width: 1;
            }
            .lane-c {
                fill: var(--claude-wash);
            }
            .s-stage {
                font: 600 13px var(--f-display);
                fill: var(--ink);
                letter-spacing: 0.02em;
            }
            .s-num {
                font: 500 11px var(--f-mono);
                fill: var(--muted);
            }
            .s-col {
                font: 600 12px var(--f-display);
                fill: var(--muted);
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }
            .s-lane {
                font: 600 13px var(--f-display);
                letter-spacing: 0.02em;
            }
            .s-lane-sub {
                font-size: 10.5px;
                fill: var(--muted);
            }
            .l-dev {
                fill: var(--dev);
            }
            .l-claude {
                fill: var(--claude);
            }
            .l-bot {
                fill: var(--bot);
            }
            .l-team {
                fill: var(--team);
            }
            .l-sys {
                fill: var(--sys);
            }
            .t {
                font-size: 12px;
                font-weight: 500;
                fill: var(--ink);
            }
            .t-b {
                font: 600 13.5px var(--f-display);
                fill: var(--ink);
                letter-spacing: 0.01em;
            }
            .t-sub {
                font-size: 10.5px;
                fill: var(--muted);
            }
            .t-mono {
                font: 500 11px var(--f-mono);
                fill: var(--ink);
                letter-spacing: 0.04em;
            }
            .lbl {
                font-size: 10.5px;
                fill: var(--muted);
            }
            .lbl-go {
                font-size: 10.5px;
                fill: var(--pend);
                font-weight: 600;
            }
            .lbl-c {
                font-size: 10.5px;
                fill: var(--claude);
                font-weight: 500;
            }
            .n {
                fill: var(--surface);
                stroke: var(--line);
                stroke-width: 1;
            }
            .n-claude {
                fill: var(--claude-bg);
                stroke: var(--claude);
                stroke-width: 1;
            }
            .n-dev {
                fill: var(--dev-bg);
                stroke: var(--dev);
                stroke-width: 1;
            }
            .n-bot {
                fill: var(--bot-bg);
                stroke: var(--bot);
                stroke-width: 1;
            }
            .n-team {
                fill: var(--team-bg);
                stroke: var(--team);
                stroke-width: 1;
            }
            .n-env {
                fill: var(--sys-bg);
                stroke: var(--sys);
                stroke-width: 1;
            }
            .n-pend {
                fill: var(--pend-bg);
                stroke: var(--pend-line);
                stroke-width: 1.5;
                stroke-dasharray: 5 3;
            }
            .n-end {
                fill: var(--surface);
                stroke: var(--claude);
                stroke-width: 1.5;
            }
            .stamp {
                fill: var(--pend-bg);
                stroke: var(--pend);
                stroke-width: 1;
            }
            .stamp-t {
                font: 600 8.5px var(--f-mono);
                fill: var(--pend);
                letter-spacing: 0.08em;
            }
            .e {
                stroke: var(--muted);
                stroke-width: 1.4;
                fill: none;
            }
            .e-c {
                stroke: var(--claude);
                stroke-width: 1.5;
                fill: none;
            }
            .e-go {
                stroke: var(--pend);
                stroke-width: 1.5;
                stroke-dasharray: 4 3;
                fill: none;
            }
            .bus {
                stroke: var(--muted);
                stroke-width: 1.4;
                fill: none;
            }
            .ah {
                fill: var(--muted);
            }
            .ah-c {
                fill: var(--claude);
            }
            .ah-go {
                fill: var(--pend);
            }
            .dot-on {
                fill: var(--claude);
            }
            .dot-off {
                fill: none;
                stroke: var(--claude);
                stroke-width: 1.2;
            }
            .t-role {
                font: 500 11.5px var(--f-mono);
                fill: var(--claude);
            }
            .t-s {
                font-size: 11px;
                font-weight: 500;
                fill: var(--ink);
            }
            .grp {
                fill: none;
                stroke: var(--muted);
                stroke-width: 1;
                stroke-dasharray: 4 4;
                opacity: 0.7;
            }
        </style>

        <div class="wrap">
            <h1>Claims Delivery Loop</h1>

            <!-- 1. Swimlane -->

                <div class="legend">
                    <span

                            <circle cx="16" cy="5" r="3.5" class="dot-on" />

                                cy="5"
                                r="3.5"
                                class="dot-off"

                    <span

                        developer</span

                    <span><span class="sw-go"></span>go-ahead</span>
                    <span><span class="sw-c"></span>Claude's next step</span>
                    <span><span class="sw-m"></span>hand-off</span>
